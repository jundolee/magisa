return `<div class="head new-head">${brand}<nav class="navlinks"><span class="on">글 모아보기</span><a href="https://www.techgotgan.co.kr/digest" target="_blank" rel="noopener">주간 큐레이션</a><a href="https://www.techgotgan.co.kr/blogs" target="_blank" rel="noopener">블로그 목록</a></nav><div class="headlinks"><a href="https://www.techgotgan.co.kr/suggest" target="_blank" rel="noopener">블로그 추천 ↗</a><a class="login" href="https://www.techgotgan.co.kr/login" target="_blank" rel="noopener">로그인</a></div></div><div class="new-layout"><aside class="sidebar"><p class="side-label">LIBRARY</p><button class="side-item on" onclick="document.querySelectorAll('.new-row').forEach(x=>x.hidden=false)">▤　모든 글</button><button class="side-item" onclick="document.querySelectorAll('.new-row').forEach(x=>x.hidden=x.querySelector('.save').getAttribute('aria-pressed')!=='true')">☆　저장한 글</button><div class="divider"></div><p class="side-label">TOPICS</p>${['전체','Frontend','Backend','AI / ML','DevOps','Culture'].map(t=>`<button class="side-item" onclick="document.querySelectorAll('.sidebar .side-item').forEach(x=>x.classList.remove('on'));this.classList.add('on');document.querySelectorAll('.new-row').forEach(x=>x.hidden='${t}'!=='전체'&&x.dataset.topic!=='${t}')">${t}</button>`).join('')}<div class="divider"></div><label style="font-size:12px;padding-left:12px">블로그 <select aria-label="블로그 선택" style="max-width:160px;margin:10px 12px;padding:8px;border:1px solid #e1e7d8;border-radius:7px;background:white;font-size:12px" onchange="document.querySelectorAll('.new-row').forEach((x,i)=>x.hidden=this.value!=='all'&&i!==Number(this.value))"><option value="all">모든 블로그</option>${articles.map((a,i)=>`<option value="${i}">${esc(a.source)}</option>`).join('')}</select></label><p class="side-note">여러 테크 블로그를<br>한곳에서 이어 읽어요.</p></aside><main><div class="main-hero"><div class="eyebrow">개발자의 읽을거리</div><h1>흩어진 기술 이야기, 여기서 이어 읽어요.</h1><p>여러 테크 블로그의 새 글을 한곳에 모았어요.</p></div><div class="feed-toolbar"><nav class="tabline"><span class="on">안읽은 글</span><span>전체</span><span>읽은 글</span></nav><input class="search" aria-label="글 제목 검색" placeholder="⌕  어떤 글을 찾으세요?" oninput="document.querySelectorAll('.new-row').forEach(x=>x.hidden=!x.querySelector('h3').textContent.toLowerCase().includes(this.value.toLowerCase()))"></div><div class="sortline"><span>모든 주제 · 모든 블로그</span><span>최신순 ↓</span></div>${rows}</main></div>`;}
const example={lead:'모델 단가보다 프롬프트 캐시가 실제 비용을 더 크게 바꿀 수 있습니다.',points:[['문제와 배경','저렴한 모델로 바꾼 뒤에도 요청당 비용이 늘었습니다. 반복되는 지시문과 카테고리 목록의 캐시 활용이 원인이었습니다.'],['기술과 해결책','모델 교체 전후의 캐시 사용량을 확인하고, 반복되는 프롬프트 앞부분이 재사용되는 조건을 비교합니다.'],['교훈과 주의점','단가와 오류율만으로 교체 효과를 판단하기 어렵습니다. 캐시 사용량과 요청당 실제 비용을 함께 확인해야 합니다.']]};
function summary(old){const a=articles[1],status=$('status').value;const related=`<section class="related"><h2>${old?'관련 기사':'이어서 읽어볼 글'}</h2><p>${old?'AI 의미 연결 · 디자인 예시':'AI가 고른 연관 글 · 디자인 예시'}</p>${articles.filter((x,i)=>i!==1).slice(0,2).map(x=>`<a href="#" onclick="return false">${esc(x.title)} <span style="float:right;color:#9ca58e">↗</span></a>`).join('')}</section>`;
const pending=`<div class="unavailable"><h2>${status==='pending'?'AI 요약을 만들고 있어요':'이 글은 요약을 제공할 수 없어요'}</h2><p>${status==='pending'?'원문을 확인하고 핵심 내용을 정리하고 있습니다. 기다리는 동안 원문을 읽을 수 있어요.':'원문 본문을 추출할 수 없어 요약을 제공하지 않습니다. 원문에서 내용을 확인해 주세요.'}</p></div>`;
const ready=old?`<section class="old-summary"><div class="summary-label"><b>✨ AI 엔지니어링 브리핑</b><span class="basis">원문 전문 기반 요약 · 표시 예시</span></div><p class="old-lead">${example.lead}</p>${example.points.map((p,i)=>`<div class="box ${['problem','solution','lesson'][i]}"><b>${['🚨 문제 & 배경','🛠️ 기술 & 해결책','💡 교훈 & 주의점'][i]}</b><p>${p[1]}</p></div>`).join('')}</section>`:`<div class="summary-mark"><span>AI 요약</span><span>원문 전문 기반 · 표시 예시</span></div><p class="lead">${example.lead}</p>${example.points.map((p,i)=>`<section class="keypoint"><span class="num">0${i+1}</span><div><h2>${p[0]}</h2><p>${p[1]}</p></div></section>`).join('')}<p class="notice">AI가 정리한 내용에는 오류가 있을 수 있습니다. 정확한 내용은 원문에서 확인해 주세요.</p>`;
return feed(old)+`<div class="summary-backdrop"><span class="overlay-note">요약 내용은 레이아웃 비교를 위한 예시입니다.</span><section class="dialog ${old?'':'improved-dialog'}" aria-label="AI 요약 디자인"><div class="dialog-head"><button onclick="${send('feed',0)}">← 글 목록</button><span>${old?'':'AI 요약 · 디자인 예시'}</span><button aria-label="닫기" onclick="${send('feed',0)}">✕</button></div><div class="dialog-body">${old?`<div class="badges"><span>${esc(a.source)}</span><span>${a.topic}</span><span>${a.date}</span></div><h1>${esc(a.title)}</h1>`:`<div class="story-meta">${esc(a.source)}<span>·</span>${a.date}<span>·</span>${a.topic}</div><h1>${esc(a.title)}</h1>`}${status==='ready'?ready:pending}${old?`<a class="cta" href="https://www.techgotgan.co.kr/articles/28cf2d2e-6fe4-4160-86d3-38286ac5ff12" target="_blank" rel="noopener">${esc(a.source)}에서 전체 원문 읽기 ↗</a>`:''}${related}${old?'<p class="notice" style="text-align:center">원문과 발행처를 확인한 뒤 읽어 주세요.</p>':''}</div>${old?'':`<footer class="reader-footer"><span class="summary-nav">${esc(a.source)}<br>본문에서 자세히 확인하세요</span><div style="display:flex;gap:10px"><button class="save" aria-pressed="false" onclick="this.setAttribute('aria-pressed',this.getAttribute('aria-pressed')!=='true');this.textContent=this.getAttribute('aria-pressed')==='true'?'★ 저장됨':'☆ 저장'">☆ 저장</button><a class="cta" href="https://www.techgotgan.co.kr/articles/28cf2d2e-6fe4-4160-86d3-38286ac5ff12" target="_blank" rel="noopener">원문 읽기 ↗</a></div></footer>`}</section></div>`;}
function fit(){document.querySelectorAll('.scale').forEach(box=>{const frame=box.querySelector('iframe'),w=Number(box.dataset.width),h=Number(box.dataset.height),ratio=Math.min(1,box.clientWidth/w);frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform=`scale(${ratio})`;box.style.height=h*ratio+'px';if(w===390){box.style.maxWidth='390px';box.style.margin='auto'}})}
function render(){const mobile=scene==='summary'&&$('device').value==='390',width=mobile?390:1440,height=mobile?844:900;document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scene===scene)));document.querySelectorAll('[data-version]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.version===version)));$('device-label').hidden=scene!=='summary';$('status-label').hidden=scene!=='summary';$('panes').replaceChildren();(version==='both'?['current','improved']:[version]).forEach(v=>{const old=v==='current',pane=document.createElement('section');pane.className='pane';pane.innerHTML=`<div class="label"><b>${old?'AS IS · 현재':'TO BE · 개선'}</b><small>${scene==='feed'?(old?'중앙 720px 안에 탐색과 글이 모인 구조':'탐색은 왼쪽 · 읽기는 중앙 720px'):(old?'다색 카드와 중첩된 강조':'핵심 결론 → 세 가지 요점 → 원문')}</small></div><div class="window"><div class="browserbar"><i></i><i></i><i></i><span class="address">techgotgan.co.kr / ${scene==='feed'?'feed':'article · summary design'}</span></div><div class="scale" data-width="${width}" data-height="${height}"></div></div>`;const frame=document.createElement('iframe');frame.title=`${old?'현재':'개선'} ${scene==='feed'?'PC 피드':'AI 요약'} 목업`;frame.srcdoc=`<!doctype html><html lang="ko"><meta charset="utf-8"><style>${css}</style><body class="${mobile?'mobile ':''}${$('annotate').checked?'annotate':''}">${scene==='feed'?feed(old):summary(old)}</body></html>`;pane.querySelector('.scale').append(frame);$('panes').append(pane)});$('caption').innerHTML=(scene==='feed'?[['01 · 탐색과 읽기의 역할 분리','주제와 블로그 선택을 왼쪽으로 옮겨 글 목록 위의 조작 영역을 줄였습니다.'],['02 · 본문 폭은 720px로 제한','화면 전체로 글줄을 늘리지 않고, 넓은 여백 안에서 제목과 요약을 편하게 읽도록 구성했습니다.'],['03 · 글 제목에서 요약으로','두 번째 글 제목을 누르면 AI 요약 목업으로 이동합니다. 검색·주제·블로그 필터·저장도 눌러볼 수 있습니다.']]:[['01 · 한 문장 결론을 가장 먼저','AI 요약 이름보다 핵심 내용을 크게 보여줘 글의 쓸모를 빠르게 판단하도록 했습니다.'],['02 · 색 대신 순서와 간격','빨강·파랑·노랑 박스를 세 개의 차분한 문단으로 정리했습니다. 요약 근거 표시는 유지했습니다.'],['03 · 원문은 항상 같은 위치','PC와 모바일 모두 하단에 원문 이동을 고정하고, 연관 글은 핵심 요약 뒤로 내려 읽기 흐름을 정리했습니다.']]).map(x=>`<div><b>${x[0]}</b><p>${x[1]}</p></div>`).join('');fit()}
document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{scene=b.dataset.scene;selected=1;history.replaceState(null,'',scene==='summary'?'#summary':'#feed');render()});document.querySelectorAll('[data-version]').forEach(b=>b.onclick=()=>{version=b.dataset.version;render()});$('device').onchange=render;$('status').onchange=render;$('annotate').onchange=render;addEventListener('resize',fit);addEventListener('message',e=>{if(![...document.querySelectorAll('iframe')].some(f=>f.contentWindow===e.source))return;if(e.data.type==='summary'){selected=Number(e.data.id);scene='summary';render()}if(e.data.type==='feed'){scene='feed';render()}});new ResizeObserver(fit).observe($('panes'));render();
</script></html>
